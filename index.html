<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrows Puzzle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
  /* Layout: coluna única centrada; o tabuleiro é uma placa de sinalização com setas. */
  :root {
    --bg: #e6ecf0;
    --surface: #f7f9fa;
    --cell: #d8e1e7;
    --text: #18232c;
    --muted: #5d6d79;
    --arrow: #1d3b53;
    --danger: #c8412f;
    --hint: #d98f00;
    --shadow: 0 2px 12px rgba(24,35,44,.10);
    --font-display: "Bungee", "Arial Black", Impact, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171d;
      --surface: #19232b;
      --cell: #233039;
      --text: #e4ebf0;
      --muted: #8a9ba7;
      --arrow: #9cc8ec;
      --danger: #ff7a66;
      --hint: #ffbf3f;
      --shadow: 0 2px 12px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10171d;
    --surface: #19232b;
    --cell: #233039;
    --text: #e4ebf0;
    --muted: #8a9ba7;
    --arrow: #9cc8ec;
    --danger: #ff7a66;
    --hint: #ffbf3f;
    --shadow: 0 2px 12px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; color: var(--arrow); margin: 4px 0 12px; letter-spacing: .04em; }
  .hud .value { font-variant-numeric: tabular-nums; }
  button:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
  .hud {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: .95rem;
  }
  .hud .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
  .hud .value { font-weight: 600; font-size: 1.1rem; }
  .lives { color: var(--danger); letter-spacing: 2px; }
  .lives .lost { opacity: .2; }

  .board-wrap {
    width: min(100%, 480px);
    aspect-ratio: 1;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 10px;
    overflow: hidden;
    position: relative;
  }
  .board { width: 100%; height: 100%; display: block; overflow: visible; }
  .dot { fill: var(--cell); }
  .arrow { cursor: pointer; color: var(--arrow); }
  .arrow .line { fill: none; stroke: currentColor; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
  .arrow .head { fill: currentColor; }
  .arrow .hit { fill: none; stroke: transparent; stroke-width: 80; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; }
  .arrow:focus { outline: none; }
  .arrow:focus-visible .line { stroke: var(--hint); }
  .arrow.flying { pointer-events: none; }
  .arrow.shake { animation: shake .4s ease; color: var(--danger); }
  .arrow.blocker { animation: blink .6s ease; }
  .arrow.hint { color: var(--hint); animation: glow 1s ease infinite; }

  @keyframes shake {
    0%,100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 0); }
    40% { transform: translate(6px, 0); }
    60% { transform: translate(-4px, 0); }
    80% { transform: translate(4px, 0); }
  }
  @keyframes blink {
    0%,100% { color: var(--arrow); }
    40% { color: var(--danger); }
  }
  @keyframes glow {
    0%,100% { opacity: 1; }
    50% { opacity: .45; }
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button.btn {
    font: inherit;
    font-size: .95rem;
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn.primary { background: var(--arrow); color: var(--surface); font-weight: 600; }

  .help { color: var(--muted); font-size: .85rem; max-width: 480px; text-align: center; margin-top: 14px; line-height: 1.4; }

  .overlay {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 5;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--arrow); }
  .overlay p { margin: 0 0 6px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .arrow.shake, .arrow.hint, .arrow.blocker { animation: none; }
  }
</style>
</head>
<body>
  <h1>Arrows</h1>

  <div class="hud">
    <div><div class="label">Fase</div><div class="value" id="level">1</div></div>
    <div><div class="label">Setas</div><div class="value" id="remaining">0</div></div>
    <div><div class="label">Vidas</div><div class="value lives" id="lives"></div></div>
    <div><div class="label">Recorde</div><div class="value" id="best">1</div></div>
  </div>

  <div class="board-wrap">
    <svg class="board" id="board" aria-label="Tabuleiro"></svg>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button class="btn primary" id="overlay-btn"></button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="hint-btn">Dica (2)</button>
    <button class="btn" id="restart-btn">Reiniciar fase</button>
  </div>

  <p class="help">
    Toque numa seta para ela deslizar para fora do tabuleiro, seguindo a ponta.
    Ela só sai se não houver outra seta à frente da ponta. Tocar numa seta bloqueada custa uma vida.
  </p>

<script>
(() => {
  const DIRS = {
    up:    { dx: 0,  dy: -1 },
    right: { dx: 1,  dy: 0 },
    down:  { dx: 0,  dy: 1 },
    left:  { dx: -1, dy: 0 },
  };
  const DIR_KEYS = Object.keys(DIRS);
  const DIR_NAMES = { up: 'cima', right: 'a direita', down: 'baixo', left: 'a esquerda' };
  const MAX_LIVES = 3;
  const HINTS_PER_LEVEL = 2;
  const CELL = 100; // unidades do SVG por casa
  const SVG_NS = 'http://www.w3.org/2000/svg';

  // Gerador pseudoaleatório com semente: a mesma fase sempre gera o mesmo tabuleiro.
  function mulberry32(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function levelParams(level) {
    return {
      size: Math.min(5 + Math.floor((level - 1) / 3), 10),
      // comprimento máximo de uma seta, em casas
      maxLen: Math.min(3 + Math.floor(level / 2), 9),
      // chance de preferir as escolhas que criam cadeias de dependência mais longas
      greed: Math.min(0.15 + level * 0.07, 0.95),
    };
  }

  // Casas à frente da ponta da seta, até a borda.
  function rayCells(x, y, dir, size) {
    const { dx, dy } = DIRS[dir];
    const cells = [];
    let cx = x + dx, cy = y + dy;
    while (cx >= 0 && cy >= 0 && cx < size && cy < size) {
      cells.push([cx, cy]);
      cx += dx; cy += dy;
    }
    return cells;
  }

  const headOf = a => a.cells[a.cells.length - 1];

  // A seta inteira desliza seguindo a ponta, então só importa o caminho à frente da ponta.
  function blockerOf(grid, a) {
    const [hx, hy] = headOf(a);
    for (const [cx, cy] of rayCells(hx, hy, a.dir, grid.length)) {
      if (grid[cy][cx]) return grid[cy][cx];
    }
    return null;
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Divide o tabuleiro inteiro em caminhos (o corpo das setas), sem sobrar casa vazia.
  function partition(size, rng, maxLen) {
    const inside = (x, y) => x >= 0 && y >= 0 && x < size && y < size;
    const owner = Array.from({ length: size }, () => Array(size).fill(-1));
    const freeNeighbors = (x, y) => DIR_KEYS.map(k => DIRS[k])
      .filter(d => inside(x + d.dx, y + d.dy) && owner[y + d.dy][x + d.dx] === -1);
    const paths = [];

    const cells = [];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) cells.push([x, y]);
    for (const [sx, sy] of shuffle(cells, rng)) {
      if (owner[sy][sx] !== -1) continue;
      const id = paths.length;
      const path = [[sx, sy]];
      owner[sy][sx] = id;
      // setas curtas são mais comuns; as longas aparecem de vez em quando
      const len = 2 + Math.floor(rng() ** 2 * (maxLen - 1));
      let last = null;
      while (path.length < len) {
        const [cx, cy] = path[path.length - 1];
        const options = freeNeighbors(cx, cy);
        if (!options.length) break;
        let step = last && rng() < 0.5 ? options.find(d => d === last) : null;
        if (!step) {
          // prefere a casa com menos vizinhas livres, para não deixar casas isoladas
          const deg = d => freeNeighbors(cx + d.dx, cy + d.dy).length;
          const min = Math.min(...options.map(deg));
          const best = options.filter(d => deg(d) === min);
          step = best[Math.floor(rng() * best.length)];
        }
        const nx = cx + step.dx, ny = cy + step.dy;
        path.push([nx, ny]);
        owner[ny][nx] = id;
        last = step;
      }
      paths.push(path);
    }

    // Casas que ficaram sozinhas são juntadas a um caminho vizinho. Se a vizinha
    // estiver no meio de um caminho, ele é cortado ali e a casa entra na ponta.
    for (let guard = 0; guard < 400; guard++) {
      const si = paths.findIndex(p => p.length === 1);
      if (si === -1) return paths;
      const [sx, sy] = paths[si][0];
      const nbrs = shuffle(DIR_KEYS.map(k => [sx + DIRS[k].dx, sy + DIRS[k].dy]).filter(([x, y]) => inside(x, y)), rng);
      const pathOf = ([x, y]) => paths.findIndex(p => p.some(([px, py]) => px === x && py === y));
      let done = false;
      for (const n of nbrs) {
        const p = paths[pathOf(n)];
        if (p[0][0] === n[0] && p[0][1] === n[1]) { p.unshift([sx, sy]); done = true; break; }
        const e = p[p.length - 1];
        if (e[0] === n[0] && e[1] === n[1]) { p.push([sx, sy]); done = true; break; }
      }
      if (!done) {
        const n = nbrs[0];
        const pi = pathOf(n);
        const p = paths[pi];
        const i = p.findIndex(([x, y]) => x === n[0] && y === n[1]);
        paths[pi] = [...p.slice(0, i + 1), [sx, sy]];
        paths.push(p.slice(i + 1));
      }
      paths.splice(si, 1);
    }
    return null;
  }

  // Escolhe para que lado cada caminho aponta, tirando setas uma a uma: só sai uma
  // seta cujo caminho à frente da ponta já esteja vazio. Se todas saem, a fase tem
  // solução. Para dificultar, prefere a ponta que só ficou livre por último.
  function orient(paths, size, rng, greed) {
    const occ = Array.from({ length: size }, () => Array(size).fill(-1));
    paths.forEach((p, i) => p.forEach(([x, y]) => { occ[y][x] = i; }));
    const options = p => [p, [...p].reverse()].map(cells => {
      const [hx, hy] = cells[cells.length - 1];
      const [px, py] = cells[cells.length - 2];
      const dir = DIR_KEYS.find(k => DIRS[k].dx === hx - px && DIRS[k].dy === hy - py);
      return { cells, dir };
    });
    const firstFree = new Map(); // "caminho:lado" -> passo em que ficou livre
    const left = new Set(paths.keys());
    const arrows = [];
    for (let step = 0; left.size; step++) {
      const ready = [];
      for (const i of left) {
        options(paths[i]).forEach((o, side) => {
          const [hx, hy] = o.cells[o.cells.length - 1];
          if (rayCells(hx, hy, o.dir, size).every(([x, y]) => occ[y][x] === -1)) {
            const key = `${i}:${side}`;
            if (!firstFree.has(key)) firstFree.set(key, step);
            ready.push({ i, o, at: firstFree.get(key) });
          }
        });
      }
      if (!ready.length) return null;
      let pick;
      if (rng() < greed) {
        const latest = Math.max(...ready.map(r => r.at));
        const pool = ready.filter(r => r.at === latest);
        pick = pool[Math.floor(rng() * pool.length)];
      } else {
        pick = ready[Math.floor(rng() * ready.length)];
      }
      left.delete(pick.i);
      for (const [x, y] of pick.o.cells) occ[y][x] = -1;
      arrows.push(pick.o);
    }
    return arrows;
  }

  // Número de "rodadas" para resolver tirando todas as setas livres de uma vez:
  // mede o tamanho da maior cadeia de dependência.
  function chainDepth(grid, arrows) {
    const g = grid.map(r => [...r]);
    let left = [...arrows], waves = 0;
    while (left.length) {
      const free = left.filter(a => !blockerOf(g, a));
      if (!free.length) return Infinity;
      for (const a of free) for (const [x, y] of a.cells) g[y][x] = null;
      left = left.filter(a => !free.includes(a));
      waves++;
    }
    return waves;
  }

  // Gera vários tabuleiros cheios para a fase e, nas fases mais avançadas,
  // fica com o que tem a cadeia de dependência mais longa.
  function generate(level) {
    const rng = mulberry32(level * 7919 + 17);
    const { size, maxLen, greed } = levelParams(level);
    let best = null;
    for (let tries = 0; tries < 200 && (!best || tries < 12); tries++) {
      const paths = partition(size, rng, maxLen);
      if (!paths) continue;
      const oriented = orient(paths, size, rng, greed);
      if (!oriented) continue;
      const grid = Array.from({ length: size }, () => Array(size).fill(null));
      const arrows = oriented.map((o, id) => ({ id, cells: o.cells, dir: o.dir }));
      for (const a of arrows) for (const [x, y] of a.cells) grid[y][x] = a;
      const depth = chainDepth(grid, arrows);
      if (!best || (rng() < greed ? depth > best.depth : false)) best = { size, grid, arrows, depth };
    }
    return best;
  }

  // ---------- Estado e interface ----------
  const $ = id => document.getElementById(id);
  const boardEl = $('board');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { level: 1, lives: MAX_LIVES, hints: HINTS_PER_LEVEL, grid: null, size: 0, remaining: 0, over: false };
  const arrowEls = new Map();

  function loadNum(key) {
    try { return parseInt(localStorage.getItem(key) || '1', 10) || 1; } catch { return 1; }
  }
  function saveNum(key, value) {
    try { localStorage.setItem(key, String(value)); } catch {}
  }
  const loadBest = () => loadNum('arrows-best');

  function startLevel(level) {
    const { size, grid, arrows } = generate(level);
    Object.assign(state, { level, lives: MAX_LIVES, hints: HINTS_PER_LEVEL, grid, size, remaining: arrows.length, over: false });
    saveNum('arrows-level', level);
    hideOverlay();
    render(arrows);
  }

  const center = v => v * CELL + CELL / 2;
  const svgEl = (tag, attrs) => {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };

  // Ponta da seta: triângulo desenhado apontando para cima e girado.
  const HEAD_POINTS = '0,-34 27,8 -27,8';
  const ROT = { up: 0, right: 90, down: 180, left: 270 };

  function render(arrows) {
    const { size } = state;
    const pad = CELL * 0.1;
    boardEl.setAttribute('viewBox', `${-pad} ${-pad} ${size * CELL + 2 * pad} ${size * CELL + 2 * pad}`);
    boardEl.innerHTML = '';
    arrowEls.clear();

    const dots = svgEl('g', {});
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      dots.appendChild(svgEl('circle', { class: 'dot', cx: center(x), cy: center(y), r: 5 }));
    }
    boardEl.appendChild(dots);

    for (const a of arrows) {
      const pts = a.cells.map(([x, y]) => `${center(x)},${center(y)}`).join(' ');
      const [hx, hy] = headOf(a);
      const g = svgEl('g', { class: 'arrow', tabindex: 0, role: 'button', 'aria-label': `Seta de ${a.cells.length} casas apontando para ${DIR_NAMES[a.dir]}` });
      const line = svgEl('polyline', { class: 'line', points: pts });
      const head = svgEl('polygon', { class: 'head', points: HEAD_POINTS, transform: `translate(${center(hx)} ${center(hy)}) rotate(${ROT[a.dir]})` });
      const hit = svgEl('polyline', { class: 'hit', points: pts });
      g.append(line, head, hit);
      g.addEventListener('click', () => tap(a));
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(a); } });
      boardEl.appendChild(g);
      arrowEls.set(a, { g, line, head });
    }
    updateHud();
  }

  function updateHud() {
    $('level').textContent = state.level;
    $('remaining').textContent = state.remaining;
    $('best').textContent = Math.max(loadBest(), state.level);
    $('lives').innerHTML = Array.from({ length: MAX_LIVES }, (_, i) =>
      `<span class="${i < state.lives ? '' : 'lost'}">♥</span>`).join('');
    const hb = $('hint-btn');
    hb.textContent = `Dica (${state.hints})`;
    hb.disabled = state.hints <= 0 || state.over;
  }

  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }

  function tap(a) {
    if (state.over || !arrowEls.has(a)) return;
    const els = arrowEls.get(a);
    const blocker = blockerOf(state.grid, a);

    if (blocker) {
      state.lives--;
      restartAnim(els.g, 'shake');
      restartAnim(arrowEls.get(blocker).g, 'blocker');
      if (navigator.vibrate) navigator.vibrate(80);
      updateHud();
      if (state.lives <= 0) {
        state.over = true;
        updateHud();
        setTimeout(() => showOverlay('Sem vidas!', `Você ficou sem vidas na fase ${state.level}.`, 'Tentar de novo', () => startLevel(state.level)), 450);
      }
      return;
    }

    for (const [x, y] of a.cells) state.grid[y][x] = null;
    arrowEls.delete(a);
    state.remaining--;
    document.querySelectorAll('.arrow.hint').forEach(el => el.classList.remove('hint'));
    flyAway(a, els);
    updateHud();

    if (state.remaining === 0) {
      state.over = true;
      saveNum('arrows-best', Math.max(loadBest(), state.level + 1));
      saveNum('arrows-level', state.level + 1);
      updateHud();
      setTimeout(() => showOverlay('Fase concluída!', `Você limpou a fase ${state.level}.`, 'Próxima fase', () => startLevel(state.level + 1)), 650);
    }
  }

  // A seta desliza pelo próprio traçado: o corpo segue a ponta até sair do tabuleiro.
  function flyAway(a, { g, line, head }) {
    g.classList.add('flying');
    if (reduceMotion) { g.remove(); return; }
    const { dx, dy } = DIRS[a.dir];
    const [hx, hy] = headOf(a);
    const bodyLen = (a.cells.length - 1) * CELL;
    const travel = bodyLen + (state.size + 1) * CELL;
    const pts = a.cells.map(([x, y]) => `${center(x)},${center(y)}`);
    pts.push(`${center(hx) + dx * travel},${center(hy) + dy * travel}`);
    line.setAttribute('points', pts.join(' '));
    line.setAttribute('stroke-dasharray', `${bodyLen} ${travel * 2}`);

    const duration = Math.min(300 + a.cells.length * 40, 650);
    const t0 = performance.now();
    const step = now => {
      const t = Math.min((now - t0) / duration, 1);
      const s = travel * t * t; // acelera ao sair
      line.setAttribute('stroke-dashoffset', -s);
      head.setAttribute('transform', `translate(${center(hx) + dx * s} ${center(hy) + dy * s}) rotate(${ROT[a.dir]})`);
      if (t < 1) requestAnimationFrame(step); else g.remove();
    };
    requestAnimationFrame(step);
  }

  function useHint() {
    if (state.hints <= 0 || state.over) return;
    for (const [a, els] of arrowEls) {
      if (!blockerOf(state.grid, a)) {
        state.hints--;
        els.g.classList.add('hint');
        updateHud();
        return;
      }
    }
  }

  function showOverlay(title, text, label, onClick) {
    $('overlay-title').textContent = title;
    $('overlay-text').textContent = text;
    const b = $('overlay-btn');
    b.textContent = label;
    b.onclick = onClick;
    $('overlay').classList.add('show');
  }
  function hideOverlay() { $('overlay').classList.remove('show'); }

  $('hint-btn').addEventListener('click', useHint);
  $('restart-btn').addEventListener('click', () => startLevel(state.level));

  // Exposto para testes.
